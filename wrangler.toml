name = "job-watcher"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false

[triggers]
crons = ["0 */6 * * *"]

[[kv_namespaces]]
binding = "SEEN_JOBS"
id = "7de4261c599d4877bb15a4af795d129d"

[observability]
enabled = true

# Traces would record the Adzuna and Telegram URLs, which carry secrets.
[observability.traces]
enabled = false
